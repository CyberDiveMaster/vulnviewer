    <div>
      <h1>Vulnrichment Viewer</h1>
      <p id="subtitle">Browse CISA's Vulnrichment dataset by exploitation status and CVSS details, and see each CVE's BOD 26-04 remediation deadline.</p>

    <span id="filter-count"></span>
    <button id="reset-view-btn" class="toolbar-btn" type="button" title="Clear all filters, sorting, and column visibility">Reset</button>

    </div>
